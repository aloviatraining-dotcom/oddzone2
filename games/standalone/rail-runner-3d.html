const clock=new THREE.Clock();

  requestAnimationFrame(loop);

    tilt+=((jetT>0?-.85:0)-tilt)*Math.min(1,6*dt);rig.rotation.x=tilt;rig.rotation.z=-dx*(jetT>0?.3:.1);rig.rotation.y=-dx*.08;

    nextRow-=speed*dt;if(nextRow<=0)spawnRow();
    const px=runner.position.x;
    for(let i=obs.length-1;i>=0;i--){
      const o=obs[i],mv=speed*dt*(o.f||1);o.z+=mv;o.m.position.z=o.z;if(o.type==='train')o.m.rotation.z=Math.sin(o.z*.15+o.x)*.006;else moveSp(o,dt);

        const ax=Math.abs(o.x-px);if((o.type==='okada'||o.type==='vendor')&&ax<1.9&&py<2.5)o.nm=1;

  }else if(state==='menu'){

  }else if(state==='over'){
    fall=Math.min(1,fall+dt*3);upper.rotation.x=-.3-fall*1.2;rig.position.y=HIP-fall*.6;board.position.y=BY+Math.abs(Math.sin(fall*6))*.25*(1-fall);board.rotation.x-=dt*6*(1-fall);board.position.z-=dt*4*(1-fall);
